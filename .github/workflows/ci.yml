name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_AVX2: "1"
      # Windows UCRT libm dispatches by CPU and varies by OS build, so frozen
      # hash constants only hold on the machine that recorded them: assert on
      # linux (glibc stable across runners), dump-only on windows CI.
      HASH_GATE_DUMP_ONLY: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    defaults:
      run:
        working-directory: soneflow
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo test --doc
      - name: rustdoc without warnings
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Every integration test that runs without data/. The golden_*, annexb
      # and stream tests read data/ (gitignored: MoSQITo goldens regenerated by
      # tools/setup_env.sh, Annex B files supplied from your own licensed copy
      # of ISO 532-1) and stay local-only. annexb_validator's csv_* tests read
      # data/annexb and are skipped here: several of them expect a panic, so
      # without the file they would pass for the wrong reason.
      - run: >
          cargo test
          --test api_errors
          --test core_characterization
          --test determinism
          --test hash_gate
          --test low_freq_correction
          --test nl_zero_init
          --test output_grid
          --test py_contract_dump
          --test simd_dispatch
          --test simd_parity
          --test stream_alloc
          --test stream_no_rayon
          --test stream_scalar
          --test zup_eps
      - run: cargo test --test annexb_validator -- --skip csv_

  # Architecture gate (layers, cycles, CRAP, file size, forbidden patterns),
  # as in the R7 / R7a / R7b acceptance. Coverage comes from the data-free
  # tests above, so CRAP is computed on the same evidence CI has; measured
  # locally on that set at 0.1.0, the highest CRAP is 25.6 (limit 30).
  arch:
    runs-on: ubuntu-latest
    env:
      REQUIRE_AVX2: "1"
      HASH_GATE_DUMP_ONLY: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-crap@0.4.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: coverage of the data-free tests
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --release -p soneflow --lib \
            --test api_errors --test core_characterization --test determinism \
            --test hash_gate --test low_freq_correction --test nl_zero_init \
            --test output_grid --test py_contract_dump --test simd_dispatch \
            --test simd_parity --test stream_alloc --test stream_no_rayon \
            --test stream_scalar --test zup_eps
          cargo llvm-cov --no-report --release -p soneflow --test annexb_validator -- --skip csv_
          cargo llvm-cov --no-report --release -p soneflow-ffi
          cargo llvm-cov report --release --lcov --output-path lcov.info
      - run: cargo crap -p soneflow -p soneflow-ffi --lcov lcov.info --format json --output crap.json
      - run: python tools/arch_check.py --crap crap.json

  # Repository tools and documentation rules.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest -v tools/test_arch_check.py tools/test_redact_paths.py tools/test_env_guards.py
      # Committed reports and evidence carry no workstation paths (AGENTS.md).
      # Binary files are listed as skipped and need the manual check the
      # rules ask for; they do not fail this step.
      - run: python tools/redact_paths.py --check docs
      - run: python tools/doc_pairs.py --check

  ffi:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: soneflow-ffi
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: taiki-e/install-action@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          tool: cbindgen@0.29.4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: header up-to-date (cbindgen regen + diff)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cbindgen --config cbindgen.toml --crate soneflow-ffi --output include/soneflow.h
          git diff --exit-code include/soneflow.h
      # 一般測試 + panic 注入(test-panic feature 打開時兩者都跑)
      - run: cargo test --features test-panic
      - run: cargo build --release
      - name: C smoke (gcc)
        if: matrix.os == 'ubuntu-latest'
        run: |
          gcc -Wall -Wextra -Iinclude tests/smoke.c -L../target/release -lsoneflow_ffi -lm -o smoke
          LD_LIBRARY_PATH=../target/release ./smoke
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: matrix.os == 'windows-latest'
        with:
          arch: x64
      - name: C smoke (MSVC)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cl /nologo /W3 /Iinclude tests\smoke.c /link /LIBPATH:..\target\release soneflow_ffi.dll.lib
          copy ..\target\release\soneflow_ffi.dll . >NUL
          smoke.exe
  py:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Same rule as the Rust job: the smoke suite's N hashes are
      # per platform and the windows constants only hold on the machine that
      # froze them, so windows CI runs the N-hash check dump-only.
      HASH_GATE_DUMP_ONLY: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    defaults:
      run:
        working-directory: soneflow-py
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: pip install maturin && maturin build --release --out dist
      - name: install wheel into clean venv, run smoke suite
        run: |
          python -m venv sv
          if [ -x sv/bin/python ]; then VP=sv/bin/python; else VP=sv/Scripts/python.exe; fi
          "$VP" -m pip install --quiet dist/*.whl pytest
          "$VP" -m pytest tests/test_smoke.py tests/test_stream.py -v
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: soneflow-py/dist/*.whl
          if-no-files-found: error
