language = "C"
cpp_compat = true
include_guard = "SONEFLOW_H"
usize_is_size_t = true
header = """/* soneflow C ABI v1 — batch and streaming interfaces are frozen.
 * Generated by cbindgen from soneflow-ffi; do not edit by hand.
 * Regenerate: cbindgen --config cbindgen.toml --crate soneflow-ffi --output include/soneflow.h */"""

[export]
exclude = ["snf__test_panic", "snf__test_panic_rayon", "snf__test_panic_stream"]
