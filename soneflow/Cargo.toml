[package]
name = "soneflow"
version = "0.1.0"
edition = "2021"
description = "ISO 532-1:2017 Zwicker loudness (stationary + time-varying) with AVX2 acceleration"
license = "Apache-2.0"

[features]
# Internal modules for tests, benches and research code, exported as
# `soneflow::internals`. Not covered by semver: any release may change them.
internals = []

[dependencies]
thiserror = "1"
rayon = "1.12"

[dev-dependencies]
criterion = "0.5"
hound = "3.5"

[[bench]]
name = "loudness"
harness = false

[[bench]]
name = "core"
harness = false
required-features = ["internals"]

# Integration tests that reach internal stages through `soneflow::internals`.
# Without the feature, `cargo test --test <name>` stops with an error naming
# it, but a bare `cargo test` skips these silently: CI lists every test.
[[test]]
name = "core_characterization"
required-features = ["internals"]

[[test]]
name = "determinism"
required-features = ["internals"]

[[test]]
name = "golden_core"
required-features = ["internals"]

[[test]]
name = "golden_dsp"
required-features = ["internals"]

[[test]]
name = "golden_zwst"
required-features = ["internals"]

[[test]]
name = "golden_zwtv"
required-features = ["internals"]

[[test]]
name = "low_freq_correction"
required-features = ["internals"]

[[test]]
name = "simd_parity"
required-features = ["internals"]

[[test]]
name = "stream_contract"
required-features = ["internals"]

[[test]]
name = "stream_golden"
required-features = ["internals"]

[[test]]
name = "stream_scalar"
required-features = ["internals"]

[[test]]
name = "zup_eps"
required-features = ["internals"]
